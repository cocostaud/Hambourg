<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Hambourg — carnet photo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">CARNET PHOTO</div>
    <h1>Hambourg</h1>
    <div class="subtitle">67 lieux enregistrés</div>
  </div>
  <button id="mapHome" class="round-btn" title="Recentrer">⌖</button>
</header>

<nav class="main-tabs">
  <button class="active" data-tab="map"><span>🗺</span> Carte</button>
  <button data-tab="categories"><span>◫</span> Catégories</button>
  <button data-tab="quarters"><span>⌂</span> Quartiers</button>
</nav>

<main>
<section id="tab-map" class="tab active">
  <div class="map-controls">
    <label class="searchbox">
      <span>⌕</span>
      <input id="mapSearch" type="search" placeholder="Rechercher un lieu…">
    </label>
    <div class="mode-row" id="quickModes">
      <button class="mode active" data-mode=""><span>◎</span><b>Tout</b></button>
      <button class="mode" data-mode="photo"><span>📷</span><b>Photo</b></button>
      <button class="mode" data-mode="food"><span>🍴</span><b>Gourmand</b></button>
      <button class="mode" data-mode="culture"><span>🏛</span><b>Culture</b></button>
      <button class="mode" data-mode="markets"><span>🛍</span><b>Marchés</b></button>
    </div>
    <div id="categoryChips" class="chips"></div>
  </div>
  <div id="map"></div>
  <div id="mapStatus" class="status-pill">Préparation de la carte…</div>
</section>

<section id="tab-categories" class="tab content-tab">
  <div class="section-intro">
    <h2>Explorer par catégorie</h2>
    <p>Les mêmes 67 lieux, regroupés par type.</p>
  </div>
  <label class="searchbox list-search"><span>⌕</span><input id="categorySearch" type="search" placeholder="Rechercher…"></label>
  <div id="categoryGroups"></div>
</section>

<section id="tab-quarters" class="tab content-tab">
  <div class="section-intro">
    <h2>Explorer par quartier</h2>
    <p>Choisis un secteur pour retrouver les lieux qui vont ensemble.</p>
  </div>
  <label class="searchbox list-search"><span>⌕</span><input id="quarterSearch" type="search" placeholder="Rechercher…"></label>
  <div id="quarterGroups"></div>
</section>
</main>

<div id="sheet" class="sheet hidden">
  <div class="sheet-card">
    <button id="closeSheet" class="close-btn">×</button>
    <div id="sheetContent"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
